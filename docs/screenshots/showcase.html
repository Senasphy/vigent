<!doctype html>
<!--
  The README's showcase image: claude-code-agent.png on a gray shader backdrop.
  Regenerate showcase.png from the repository root with:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=2400,1400 \
    --screenshot=docs/screenshots/showcase.png "file://$PWD/docs/screenshots/showcase.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>vigent showcase</title>
<style>
  html, body { margin: 0; width: 2400px; height: 1400px; overflow: hidden; background: #18181a; }
  .stage {
    position: relative; width: 100%; height: 100%; display: grid; place-items: center; isolation: isolate;
    /* soft gray light falling from the top left, a cooler pool bottom right */
    background:
      radial-gradient(1200px 820px at 18% 8%, #7a7a80 0%, rgb(122 122 128 / 0) 62%),
      radial-gradient(1000px 760px at 88% 96%, #4a4b52 0%, rgb(74 75 82 / 0) 60%),
      radial-gradient(900px 600px at 70% 18%, #3b3b40 0%, rgb(59 59 64 / 0) 65%),
      linear-gradient(160deg, #2e2e32 0%, #1c1c1f 55%, #141416 100%);
  }
  /* bands of light, like a shader's slow wave */
  .stage::before {
    content: ""; position: absolute; inset: -10%; z-index: -1; opacity: .5;
    background: repeating-linear-gradient(118deg, rgb(255 255 255 / 0) 0 140px, rgb(255 255 255 / .035) 220px, rgb(255 255 255 / 0) 300px);
    filter: blur(18px);
  }
  /* film grain over everything */
  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .shot {
    position: relative; z-index: 1; width: 2000px; border-radius: 16px; overflow: hidden;
    box-shadow:
      0 0 0 1px rgb(255 255 255 / .10),
      0 2px 4px rgb(0 0 0 / .25),
      0 30px 60px -12px rgb(0 0 0 / .55),
      0 60px 140px -30px rgb(0 0 0 / .6);
  }
  .shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="stage">
    <div class="shot"><img src="claude-code-agent.png" alt=""></div>
  </div>
</body>
</html>
